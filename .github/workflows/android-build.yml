name: Android build

# Builds the OpenMW Android APK on GitHub's runners.
#
# The OpenMW 0.51.0 native payload (libopenmw.so + the engine resources) is
# generated, not committed, and app/build.gradle refuses to build without it.
# Instead of compiling the engine for hours, this workflow seeds the payload
# from a released APK of the same OpenMW Android version (see
# tools/GITHUB_BUILD.md) and then assembles the APK with the updated Java/Kotlin
# UI, resources and assets from this branch.
#
# Inputs (Actions -> Android build -> Run workflow):
#   payload_source          upstream | release-asset | none
#   payload_asset           asset name, used when payload_source=release-asset
#   accept_native_baseline  pin the payload's libopenmw.so digest instead of
#                           requiring the local Patch-39 digest

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      payload_source:
        description: Where the native payload comes from.
        type: choice
        options: [upstream, release-asset, none]
        required: false
        default: upstream
      payload_asset:
        description: Release asset name in this repo (payload_source=release-asset).
        required: false
        default: openmw-051-payload.zip
      accept_native_baseline:
        description: Pin whatever libopenmw.so the source archive carries.
        type: boolean
        required: false
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false'
  JAVA_VERSION: '17'
  # Released APK of the OpenMW Android version this repository is based on.
  UPSTREAM_REPO: Andiweli/OpenMW-Android
  UPSTREAM_TAG: 0.51.0-14

jobs:
  # ---------------------------------------------------------------------------
  # 1. Fast, payload-free verification of the sources.
  # ---------------------------------------------------------------------------
  kotlin-compile:
    name: Kotlin compile check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # The ubuntu runners ship the Android command line tools; only the SDK
      # packages this project needs are installed explicitly.
      - name: Install SDK packages
        run: |
          SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" -name sdkmanager -type f | head -n 1)
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Show toolchain versions
        run: |
          java -version
          ./gradlew --version

      # preBuild dependsOn verifyOpenMwPayload, which needs the generated
      # native payload. Excluding it lets the Kotlin/Java sources be compiled
      # on a payload-free checkout; the APK job below keeps the gate intact.
      - name: Compile every Kotlin/Java source (no native payload needed)
        run: |
          set +e
          ./gradlew :app:compileMainlineDebugSources \
            -x verifyOpenMwPayload \
            -x removeRetiredWaterAssets \
            --stacktrace 2>&1 | tee gradle.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::Gradle failed with exit code $status"
            # Annotations survive even when job logs/artifacts are not readable.
            matches=$(grep -nE "(^e: |error:|FAILURE:|What went wrong|Execution failed|Caused by|> Could not|Unresolved reference|Could not resolve)" gradle.log | head -n 8 || true)
            if [ -z "$matches" ]; then
              matches=$(tail -n 8 gradle.log)
            fi
            printf '%s\n' "$matches" | while IFS= read -r line; do
              [ -n "$line" ] || continue
              echo "::error::$(printf '%s' "$line" | tr -d '\r' | cut -c1-900)"
            done
            echo "===== tail of gradle.log ====="
            tail -n 40 gradle.log
          fi
          exit "$status"

      - name: Upload the Gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-compile-log
          path: source/gradle.log
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 2. Seed the native payload, then assemble the APK.
  # ---------------------------------------------------------------------------
  apk:
    name: Build APK
    needs: kotlin-compile
    if: >-
      github.event.inputs.payload_source != 'none' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    env:
      PAYLOAD_SOURCE: ${{ github.event.inputs.payload_source || 'upstream' }}
      PAYLOAD_ASSET: ${{ github.event.inputs.payload_asset || 'openmw-051-payload.zip' }}
      ACCEPT_BASELINE: ${{ github.event.inputs.accept_native_baseline || 'true' }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install SDK packages
        run: |
          SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" -name sdkmanager -type f | head -n 1)
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125"

      # Release assets are served from a different host than the API, so they
      # are fetched through the API with an octet-stream accept header.
      - name: Download the payload archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/payload
          if [ "$PAYLOAD_SOURCE" = "release-asset" ]; then
            repo="${{ github.repository }}"
            asset_id=$(gh api "repos/${repo}/releases" \
              --jq "[.[].assets[] | select(.name==\"${PAYLOAD_ASSET}\")][0].id")
            [ -n "$asset_id" ] && [ "$asset_id" != "null" ] || {
              echo "::error::release asset ${PAYLOAD_ASSET} not found in ${repo}"; exit 1; }
            gh api -H "Accept: application/octet-stream" \
              "repos/${repo}/releases/assets/${asset_id}" > /tmp/payload/payload
          else
            asset_id=$(gh api "repos/${UPSTREAM_REPO}/releases/tags/${UPSTREAM_TAG}" \
              --jq '.assets[0].id')
            echo "Downloading the ${UPSTREAM_TAG} reference APK from ${UPSTREAM_REPO}"
            gh api -H "Accept: application/octet-stream" \
              "repos/${UPSTREAM_REPO}/releases/assets/${asset_id}" > /tmp/payload/payload
          fi
          ls -l /tmp/payload/payload

      - name: Seed the native payload
        run: |
          set -euo pipefail
          args=(/tmp/payload/payload --source-version "$UPSTREAM_TAG")
          if [ "$ACCEPT_BASELINE" = "true" ]; then
            args+=(--accept-native-baseline)
          fi
          python3 tools/seed-openmw-payload.py "${args[@]}"

      - name: Verify the payload against the build gate
        run: python3 tools/verify-openmw-payload.py

      # Runs the build.gradle gates (payload, launcher, localization, OMWFX,
      # shadow shaders) up front, so one run reports every violation at once
      # instead of stopping at the first one.
      - name: Check every Gradle build gate
        run: |
          set +e
          python3 tools/check-build-gates.py 2>&1 | tee gates.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "^ - " gates.log | head -n 20 | while IFS= read -r line; do
              echo "::error::$(printf '%s' "$line" | cut -c1-900)"
            done
          fi
          exit "$status"

      - name: Upload the gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-gates
          path: source/gates.log
          if-no-files-found: warn

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Show toolchain versions
        run: |
          java -version
          ./gradlew --version

      - name: Assemble the APK
        run: |
          set +e
          ./gradlew :app:assembleMainlineDebug --stacktrace 2>&1 | tee gradle-assemble.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::assembleMainlineDebug failed with exit code $status"
            matches=$(grep -nE "(^e: |error:|FAILURE:|What went wrong|Execution failed|Caused by|> Could not|Unresolved reference|Could not resolve|AAPT)" gradle-assemble.log | head -n 8 || true)
            if [ -z "$matches" ]; then
              matches=$(tail -n 8 gradle-assemble.log)
            fi
            printf '%s\n' "$matches" | while IFS= read -r line; do
              [ -n "$line" ] || continue
              echo "::error::$(printf '%s' "$line" | tr -d '\r' | cut -c1-900)"
            done
            tail -n 60 gradle-assemble.log
          fi
          exit "$status"

      - name: Collect the APK
        id: collect
        run: |
          set -eu
          mkdir -p artifacts
          find app/build/outputs/apk -name '*.apk' -exec cp {} artifacts/ \;
          ls -l artifacts
          apk=$(find artifacts -name '*.apk' | head -n 1)
          [ -n "$apk" ] || { echo "::error::no APK was produced"; exit 1; }
          echo "apk=source/$apk" >> "$GITHUB_OUTPUT"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: openmw-android-apk
          path: ${{ steps.collect.outputs.apk }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload the Gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-assemble-log
          path: source/gradle-assemble.log
          if-no-files-found: warn
